services:
  nca-toolkit:
    build: .
    container_name: nca-toolkit
    ports:
      - "8081:8080"
    environment:
      - API_KEY=${API_KEY}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION}
      - WHISPER_MODEL_SIZE=large-v3-turbo
      - GUNICORN_TIMEOUT=3600
    volumes:
      - ncat-data:/data
    deploy:
      resources:
        limits:
          cpus: "4"  
    restart: unless-stopped
    networks:
      - services-n8nwithpostgres-ogzytr

volumes:
  ncat-data:

networks:
  services-n8nwithpostgres-ogzytr:
    name: services-n8nwithpostgres-ogzytr
    external: true 
